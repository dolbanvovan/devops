name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    # 1. Клонирование кода из репозитория
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Настройка Docker Buildx для эффективной сборки
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # 3. Авторизация в Docker Hub через Secrets
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # 4. Сборка Docker-образа и отправка в Docker Hub (Артефакт сборки)
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/cat-app:latest
          ${{ secrets.DOCKERHUB_USERNAME }}/cat-app:${{ github.sha }}
